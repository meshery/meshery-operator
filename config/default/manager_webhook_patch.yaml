apiVersion: apps/v1
kind: Deployment
metadata:
  name: meshery-operator
  namespace: meshery
spec:
  template:
    spec:
      containers:
      - name: manager
        # These CRDs declare conversion strategy Webhook, so the webhook is
        # required here: state it, so a missing serving certificate exits with
        # a structured error instead of the manager silently running without
        # it (the unset default only serves webhooks when a cert is mounted).
        env:
        - name: ENABLE_WEBHOOKS
          value: "true"
        ports:
        - containerPort: 9443
          name: webhook-server
          protocol: TCP
        volumeMounts:
        - mountPath: /tmp/k8s-webhook-server/serving-certs
          name: cert
          readOnly: true
      volumes:
      - name: cert
        secret:
          defaultMode: 420
          secretName: webhook-server-cert
