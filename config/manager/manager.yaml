---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app: meshery
    component: operator
  name: meshery-operator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: meshery-operator
  namespace: meshery
  labels:
    app: meshery
    component: operator
spec:
  selector:
    matchLabels:
      app: meshery
      component: operator
  replicas: 1
  template:
    metadata:
      labels:
        app: meshery
        component: operator
    spec:
      terminationGracePeriodSeconds: 10
      serviceAccountName: meshery-operator
      securityContext:
        runAsNonRoot: true
        # 65532 is the numeric UID/GID of the "nonroot" user in the
        # gcr.io/distroless/static:nonroot base image. kubelet's runAsNonRoot
        # admission check cannot verify a non-numeric image user, so the UID
        # must be stated explicitly here.
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: manager
        # Pinned to a published release, never a moving channel tag: a moving
        # tag re-points under running clusters, so a manifest applied months
        # ago silently starts pulling a manager build the surrounding
        # deployment was never rendered for. Both this tag and the newTag in
        # kustomization.yaml are stamped by hack/stamp-operator-version.sh on
        # every release. IfNotPresent follows from the pin - the tag is
        # immutable, so re-pulling it on every restart buys nothing and breaks
        # side-loaded (kind) and air-gapped clusters.
        image: meshery/meshery-operator:1.0.5
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: 9443
          name: server
        - containerPort: 8443
          name: https-metrics
        - containerPort: 8081
          name: health
        command:
        - /manager
        args:
        - --enable-leader-election
        - --metrics-addr=:8443
        - --health-probe-bind-address=:8081
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 64Mi
