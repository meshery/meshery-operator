# The ServiceAccount MeshSync pods run under. It is deliberately separate from
# the operator's own ServiceAccount (manager.yaml): the operator stays
# least-privilege (write access only to what it manages), while MeshSync gets
# the cluster-wide read access of config/rbac/meshsync_workload_role.yaml and
# nothing else. manager.yaml points the operator at it through the
# MESHSYNC_SERVICE_ACCOUNT env var.
#
# It lives here, unprefixed like the operator's ServiceAccount, rather than in
# config/rbac: that directory's namePrefix plus kustomize's name-reference
# resolution rewrites the ClusterRoleBinding subject to the unprefixed name when
# both ServiceAccounts are in scope (config/default), which binds nothing.
# TestRenderedInstallManifestWiresMeshSyncServiceAccount guards the rendered
# result.
#
# Cross-repo contract: the meshery-operator Helm chart in meshery/meshery creates
# the same ServiceAccount, ClusterRole (meshery-meshsync-role) and
# ClusterRoleBinding (meshery-meshsync-rolebinding) and sets
# MESHSYNC_SERVICE_ACCOUNT=meshery-meshsync.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: meshery-meshsync
  labels:
    app: meshery
    component: meshsync
