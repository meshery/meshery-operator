version: "2"

linters:
  enable:
    - goconst
    - gocritic
    - gosec
    - govet
    - staticcheck
    - unused
    - cyclop
  
  exclusions:
    paths:
      - vendor
      - bundle
      - config
      - helpers
      - img

    rules:
      # The release-script tests in hack/ copy a fixture chart tree into
      # t.TempDir() and shell out to run the real script over it, so paths built
      # from variables, an executable stub and group-readable fixture files are
      # what the harness is for, not a risk.
      #
      # Scoped to hack/'s own test files, not to _test.go everywhere: a bare
      # `_test\.go` matches every suite in the repo (controllers/, api/, pkg/),
      # so it would silently stop gosec reporting these rules across code this
      # exception was never meant to cover.
      - path: ^hack/.*_test\.go$
        linters:
          - gosec
        text: "G(204|301|302|304|306|703)"

  settings:
    goconst:
      min-len: 3
      min-occurrences: 3
    
    govet:
      enable-all: true
    
    staticcheck:
      checks: ["all", "-ST1005", "-ST1000"]
    
    unused:
      exported-fields-are-used: false
    
    cyclop:
      max-complexity: 15

formatters:
  enable:
    - gci
    - gofmt
    - goimports
  
  settings:
    gci:
      sections:
        - standard
        - default
    
    gofmt:
      simplify: true

run:
  timeout: 5m
  tests: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
